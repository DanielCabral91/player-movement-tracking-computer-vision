name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate required files and notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('README.md'),
              Path('requirements.txt'),
              Path('configs/botsort.yaml'),
              Path('notebooks/01_hsv_calibration.ipynb'),
              Path('notebooks/02_tracking_pipeline.ipynb'),
              Path('notebooks/03_tactical_metrics.ipynb'),
              Path('docs/methodology.md'),
              Path('docs/reproducibility.md'),
              Path('docs/limitations.md'),
              Path('docs/data_schema.md'),
          ]

          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          def python_only_source(source: str) -> str:
              """Remove IPython magic/shell lines before Python syntax compilation."""
              lines = []
              for line in source.splitlines():
                  stripped = line.lstrip()
                  if stripped.startswith(('%', '!')):
                      continue
                  lines.append(line)
              return '\n'.join(lines)

          for notebook_path in Path('notebooks').glob('*.ipynb'):
              notebook = json.loads(notebook_path.read_text(encoding='utf-8'))
              for index, cell in enumerate(notebook.get('cells', [])):
                  if cell.get('cell_type') != 'code':
                      continue
                  source = python_only_source(''.join(cell.get('source', [])))
                  try:
                      compile(source, f'{notebook_path}:cell-{index}', 'exec')
                  except SyntaxError as exc:
                      raise SystemExit(
                          f'Python syntax error in {notebook_path}, cell {index}: {exc}'
                      ) from exc

          print('Repository structure and notebook syntax validated successfully.')
          PY
